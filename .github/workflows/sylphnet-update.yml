# Place this file at: .github/workflows/sylphnet-update.yml  (on main branch)
# No secrets needed — uses the built-in GITHUB_TOKEN (auto-issued, never expires).
name: SylphNet Auto Update

on:
  schedule:
    - cron: '*/30 * * * *'   # change to '*/15 * * * *' for every-15-minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build subscription
        run: python update-kit/update.py --out ./out --min-configs 20

      - name: Publish to sub/
        run: |
          mkdir -p sub
          cp ./out/sub.txt ./out/sub_plain.txt sub/
          git config user.email "action@github.com"
          git config user.name "SylphNet Bot"
          git add sub/sub.txt sub/sub_plain.txt
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update subscription - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
