name: SylphNet Health Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/subv2ray_key
          chmod 600 ~/.ssh/subv2ray_key

      - name: Run health checker
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          python main.py \
            --sub-url "$SUB_URL" \
            --ssh-host "$SSH_HOST" \
            --ssh-port "$SSH_PORT" \
            --ssh-user "$SSH_USER" \
            --ssh-key ~/.ssh/subv2ray_key \
            --output sub.txt \
            --max-latency 4000

      - name: Upload subscription to public repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          source-directory: '.'
          target-directory: 'sub'
          destination-github-username: 'ProblemTheCode'
          destination-repository-name: 'SylphNet-public'
          user-email: 'action@github.com'
          user-name: 'GitHub Action'
          commit-message: 'Update subscription - ${{ github.run_number }}'
